html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{position:relative}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 22px 34px;text-align:center;overflow:hidden}
.scr.on{display:flex}
.bg{position:absolute;inset:0;background:var(--cat) 68% 50%/cover;filter:blur(26px) brightness(.45) saturate(1.2);transform:scale(1.2);z-index:-1}
.big{font-size:34px;font-weight:800;margin:0;letter-spacing:.5px}
.sub{color:var(--mute);margin:6px 0 0;font-size:17px}
.avatar{width:190px;height:190px;border-radius:50%;background:var(--cat) 68% 50%/cover;border:4px solid var(--amber);position:relative;margin:0 auto}
.avatar::before,.avatar::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--amber);animation:ping 1.8s infinite}
.avatar::after{animation-delay:.9s}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.btn{border:0;border-radius:999px;font:inherit;font-weight:700;color:#fff;cursor:pointer}
.cta{background:var(--amber);color:#2a1a08;font-size:20px;padding:16px 34px}
.row{display:flex;gap:56px;justify-content:center;width:100%}
.rb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;color:var(--mute)}
.rb .btn{width:74px;height:74px;font-size:32px}
.red{background:var(--red)}.green{background:var(--green);animation:wob .7s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
/* call */
#call{padding:0;justify-content:flex-start}
.cat{position:absolute;inset:0;background:var(--cat) 68% 50%/cover;animation:bob 3.2s ease-in-out infinite}
.cat.talk{animation:talk .22s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1.04) rotate(-.8deg)}50%{transform:scale(1.08) rotate(.8deg)}}
@keyframes talk{0%,100%{transform:scale(1.06) translateY(0)}50%{transform:scale(1.13) translateY(8px) rotate(-1.5deg)}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0009,#0000 22%,#0000 55%,#000b)}
.fl{position:absolute;font-size:34px;pointer-events:none;animation:fl 1.1s forwards;z-index:4}
@keyframes fl{to{transform:translateY(-130px) scale(1.4);opacity:0}}
.top{position:absolute;top:18px;left:0;right:0;text-align:center;z-index:2}
.top b{font-size:22px}.top span{display:block;color:var(--mute);font-size:15px}
.cap{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) scale(.6);background:var(--fg);color:#2a1a08;font-weight:800;font-size:24px;padding:10px 20px;border-radius:22px 22px 22px 6px;opacity:0;transition:.18s;white-space:nowrap;z-index:2}
.cap.on{opacity:1;transform:translateX(-50%) scale(1)}
.me{position:absolute;top:70px;right:14px;width:104px;height:140px;border-radius:16px;overflow:hidden;background:#2b221b;border:2px solid var(--glass);z-index:3}
.me video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.off{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#2b221b;font-size:12px;color:var(--mute);padding:6px}
.off i{font-size:30px;font-style:normal}
.bar{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:14px;z-index:3;padding:0 12px}
.bar .rb{font-size:12px;color:var(--fg)}
.bar .btn{width:62px;height:62px;font-size:26px;background:var(--glass);backdrop-filter:blur(10px)}
.bar .btn.act{background:var(--fg);color:#2a1a08}
.bar .btn.red{background:var(--red)}
@media (prefers-reduced-motion:reduce){.cat,.avatar::before,.avatar::after,.green{animation:none}}
</style>
</head>
<body>

<section class="scr on" id="home">
  <div class="bg"></div>
  <div></div>
  <div class="mid">
    <div class="avatar" style="animation:none"></div>
    <h1 class="big">Тилкайо Звонилка</h1>
    <p class="sub">Приложение для самых важных звонков</p>
  </div>
  <button class="btn cta" id="enter">Войти в приложение</button>
</section>

<section class="scr" id="ring">
  <div class="bg"></div>
  <div><p class="sub">Видеозвонок</p></div>
  <div class="mid">
    <div class="avatar"></div>
    <div><h1 class="big">Тилкайо</h1><p class="sub">звонит вам по видеосвязи…</p></div>
  </div>
  <div class="row">
    <div class="rb"><button class="btn red" id="decline" aria-label="Отклонить">✖</button>Отклонить</div>
    <div class="rb"><button class="btn green" id="answer" aria-label="Ответить">📹</button>Ответить</div>
  </div>
</section>

<section class="scr" id="call">
  <div class="cat" id="cat"></div>
  <div class="shade"></div>
  <div class="top"><b>Тилкайо</b><span id="timer">00:00</span></div>
  <div class="me"><video id="me" autoplay muted playsinline></video><div class="off" id="meOff"><i>🙈</i><span id="meTxt">Камера выкл</span></div></div>
  <div class="cap" id="cap"></div>
  <div class="bar">
    <div class="rb"><button class="btn act" id="camBtn">📷</button>Камера</div>
    <div class="rb"><button class="btn" id="talkBtn">🐾</button>Тилкайо!</div>
    <div class="rb"><button class="btn" id="muteBtn">🔊</button>Звук</div>
    <div class="rb"><button class="btn red" id="hang">📞</button>Завершить</div>
  </div>
</section>

<section class="scr" id="end">
  <div class="bg"></div>
  <div></div>
  <div class="mid">
    <div class="avatar" style="animation:none;filter:grayscale(.8)"></div>
    <div><h1 class="big" id="endTitle"></h1><p class="sub" id="endSub"></p></div>
  </div>
  <button class="btn cta" id="again">Позвонить ещё раз</button>
</section>

<script>
const $=id=>document.getElementById(id);
let ac,ringT,vibT,talkT,timerT,stream,camOn=false,muted=false,sec=0,ringN=0;

function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}

function tone(f1,f2,t0,dur,type='triangle',vol=.2,vib=0){
  const a=ctx(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=vib;lg.gain.value=f1*.08;l.connect(lg);lg.connect(o.frequency);l.start(t0);l.stop(t0+dur)}
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.02);
}
function meow(){
  const t=ctx().currentTime,p=.85+Math.random()*.4;
  tone(450*p,900*p,t,.22,'sawtooth',.08,6);
  tone(900*p,520*p,t+.22,.4,'sawtooth',.08,6);
}
function trill(){
  const t=ctx().currentTime,p=.9+Math.random()*.4;
  for(let i=0;i<5;i++)tone((1000+i*120)*p,(1500+i*120)*p,t+i*.075,.07,'square',.05);
}
function purr(){
  const a=ctx(),t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain(),env=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type='sawtooth';o.frequency.value=55;f.type='lowpass';f.frequency.value=260;
  g.gain.value=.1;l.frequency.value=24;lg.gain.value=.09;l.connect(lg);lg.connect(g.gain);
  env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(.9,t+.2);env.gain.setValueAtTime(.9,t+1.2);env.gain.exponentialRampToValueAtTime(.0001,t+1.7);
  o.connect(f);f.connect(g);g.connect(env);env.connect(a.destination);
  o.start(t);l.start(t);o.stop(t+1.75);l.stop(t+1.75);
}
const sounds=[chirp,chirp,meow,trill,purr];
/* смешной звук «ти-л-кай-о» */
function chirp(){
  const t=ctx().currentTime,p=.85+Math.random()*.5;
  tone(700*p,1100*p,t,.12,'square',.07);
  tone(1100*p,900*p,t+.13,.09,'triangle',.18,35);
  tone(900*p,1800*p,t+.23,.14,'sawtooth',.07);
  tone(1800*p,1000*p,t+.37,.13,'sawtooth',.07);
  tone(800*p,450*p,t+.52,.3,'triangle',.22,14);
}
function sad(){
  const t=ctx().currentTime;
  tone(900,500,t,.35,'triangle',.2,10);tone(600,250,t+.4,.6,'triangle',.2,8);
}

/* звонок + вибрация */
function ringOnce(){
  const t=ctx().currentTime;
  [784,988,1175,988,1319,1175,988,784].forEach((f,i)=>tone(f,f*1.01,t+i*.14,.12,'square',.06));
  tone(500,1300,t+1.25,.25,'sawtooth',.08,9);tone(1300,600,t+1.52,.3,'sawtooth',.08,9);
  if(ringN++%2===1)setTimeout(chirp,1500);
}
const vib=()=>navigator.vibrate&&navigator.vibrate([500,150,500,150,500]);
function startRing(){
  stopRing();show('ring');ringN=0;ringOnce();vib();
  ringT=setInterval(ringOnce,2700);vibT=setInterval(vib,1800);
}
function stopRing(){
  clearInterval(ringT);clearInterval(vibT);
  navigator.vibrate&&navigator.vibrate(0);
}

/* кот говорит */
const phrases=['Тилкайо!','Тил-кай-о-о-о!','Мур-тилкайо?','Пииип-тилкайо!','Тилкайо тилкайо!','Тилка-а-айо!','Мяу-тилкайо!'];
let capT;
function catTalk(){
  const txt=phrases[Math.floor(Math.random()*phrases.length)];
  $('cap').textContent=txt;$('cap').classList.add('on');$('cat').classList.add('talk');
  clearTimeout(capT);capT=setTimeout(()=>{$('cap').classList.remove('on');$('cat').classList.remove('talk')},1300);
  if(muted)return;
  sounds[Math.floor(Math.random()*sounds.length)]();
  navigator.vibrate&&navigator.vibrate(60);
}
function talkLoop(){catTalk();talkT=setTimeout(talkLoop,2800+Math.random()*2500)}

/* камера */
function updCam(msg){
  $('meOff').style.display=camOn?'none':'flex';
  $('meTxt').textContent=msg||'Камера выкл';
  $('camBtn').classList.toggle('act',camOn);
  $('camBtn').textContent=camOn?'📷':'🚫';
}
let camReq=0;
async function camOnFn(){
  const my=++camReq;
  camOn=false;updCam('Подключаю камеру…');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){updCam('Камера не поддерживается');return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    if(my!==camReq){s.getTracks().forEach(t=>t.stop());return}
    stream=s;$('me').srcObject=s;camOn=true;updCam();
  }catch(e){if(my===camReq){camOn=false;updCam('Нет доступа к камере')}}
}
function camOffFn(){
  camReq++;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;$('me').srcObject=null;camOn=false;updCam();
}

/* ход звонка */
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function answer(){
  stopRing();clearInterval(timerT);clearTimeout(talkT);show('call');muted=false;$('muteBtn').textContent='🔊';
  sec=0;$('timer').textContent='00:00';
  timerT=setInterval(()=>$('timer').textContent=fmt(++sec),1000);
  camOnFn();setTimeout(talkLoop,400);
}
function endCall(title,sub,sadSound){
  clearInterval(timerT);clearTimeout(talkT);clearTimeout(capT);camOffFn();
  $('cap').classList.remove('on');$('cat').classList.remove('talk');
  $('endTitle').textContent=title;$('endSub').textContent=sub;
  show('end');
  if(sadSound)sad();
}

$('enter').onclick=()=>{ctx();setTimeout(startRing,500)};
$('answer').onclick=answer;
$('decline').onclick=()=>{stopRing();endCall('Тилкайо обиделся','Он очень хотел поговорить',true)};
$('hang').onclick=()=>endCall('Звонок завершён','Вы разговаривали с Тилкайо '+fmt(sec),false);
$('again').onclick=startRing;
$('camBtn').onclick=()=>camOn?camOffFn():camOnFn();
$('talkBtn').onclick=()=>{clearTimeout(talkT);talkLoop()};
$('cat').onclick=e=>{
  const s=document.createElement('span');s.className='fl';
  s.textContent=['💛','🐾','✨'][Math.floor(Math.random()*3)];
  s.style.left=(e.clientX-17)+'px';s.style.top=(e.clientY-17)+'px';
  $('call').appendChild(s);setTimeout(()=>s.remove(),1100);
  clearTimeout(talkT);talkLoop();
};
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊'};
</script>
</body>
</html>
